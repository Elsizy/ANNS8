  <!-- Modal de feedback reutilizável -->
  <div id="feedback-modal" class="app-modal hidden" role="dialog" aria-modal="true" aria-live="polite">

  <!-- scripts -->
  <!-- mantive o login.js inalterado (ele cuida da autenticação e redirect) -->
  <script type="module" src="./login.js"></script>

  <!-- pequeno script UI: habilita toggle (NÃO altera lógica do login.js) -->
  <script>
    // Toggle de mostrar/ocultar senha — apenas UI
    (function () {
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.toggle-pass[data-target]').forEach(btn => {
          const input = document.getElementById(btn.dataset.target);
          if (!input) return;
          btn.classList.remove('showing');
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.classList.toggle('showing', !isHidden);
          });
        });
      });
    })();
  </script>
